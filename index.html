<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV Online</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="header">
        <a href="#" class="nome">PDV ONLINE</a>
        <nav>
            <ul class="menu">
                <li>Menu</li>
                <li>Imprimir</li>
            </ul>
        </nav>
    </header>
    <img src="" alt="">
    <main class="principal">
        <aside>
            <section class="produtos" id="produtos">
                <h1 class="categoria-produtos">PRODUTOS</h1>
                <input type="text" class="insert-pesquisar" id="insert-pesquisar" placeholder="Procure itens aqui...">
                <button id="button-pesquisar" class="button-pesquisar"><svg xmlns="http://www.w3.org/2000/svg" height="30px"
                        viewBox="0 -960 960 960" width="35px" fill="currentColor">
                        <path
                            d="M784-120 532-372q-30 24-69 38t-83 14q-109 0-184.5-75.5T120-580q0-109 75.5-184.5T380-840q109 0 184.5 75.5T640-580q0 44-14 83t-38 69l252 252-56 56ZM380-400q75 0 127.5-52.5T560-580q0-75-52.5-127.5T380-760q-75 0-127.5 52.5T200-580q0 75 52.5 127.5T380-400Z" />
                    </svg></button>
                <div id="card-produtos" class="card-produtos">
                    <!-- Aqui vou adicionar os cards de produtos -->
                </div>
            </section>

            <section class="checkout" id="checkout">
                <h1>CHECKOUT</h1>
                <p>Quantidade: </p>
                <p>Numero de itens: </p>
                <p>Total compras: </p>
                <ul class="lista-checkout" id="lista-checkout">
                    <li>Produto</li>
                </ul>
            </section>
        </aside>
    </main>
    <footer class="footer">
        <button id="remove" class="remove"><svg xmlns="http://www.w3.org/2000/svg" height="24px"
                viewBox="0 -960 960 960" width="24px" fill="currentColor">
                <path
                    d="M280-120q-33 0-56.5-23.5T200-200v-520h-40v-80h200v-40h240v40h200v80h-40v520q0 33-23.5 56.5T680-120H280Zm400-600H280v520h400v-520ZM360-280h80v-360h-80v360Zm160 0h80v-360h-80v360ZM280-720v520-520Z" />
            </svg>REMOVER ITENS</button>
        <button id="final" class="final"><svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 -960 960 960"
                width="24px" fill="currentColor">
                <path
                    d="m424-296 282-282-56-56-226 226-114-114-56 56 170 170Zm56 216q-83 0-156-31.5T197-197q-54-54-85.5-127T80-480q0-83 31.5-156T197-763q54-54 127-85.5T480-880q83 0 156 31.5T763-763q54 54 85.5 127T880-480q0 83-31.5 156T763-197q-54 54-127 85.5T480-80Zm0-80q134 0 227-93t93-227q0-134-93-227t-227-93q-134 0-227 93t-93 227q0 134 93 227t227 93Zm0-320Z" />
            </svg>FINALIZAR COMPRA</button>
    </footer>
    <script src="script.js"></script>
</body>

</html>
